name: Release Deno Project

permissions: {}

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project folder name (e.g., bible, fluro-songs, ghpr)"
        required: true
        type: string

jobs:
  release:
    runs-on: macos-latest
    environment: github_actions
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Read version
        id: version
        env:
          project: "${{ inputs.project }}"
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          version=$(jq -r '.version' "$project/deno.json")
          if gh release view "${project}-${version}" &> /dev/null; then
            echo "Error: ${project}-${version} is already released; bump the version in $project/deno.json first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build deno binary
        env:
          project: "${{ inputs.project }}"
        run: |
          cd "$project"
          deno run build

      - name: Create Release
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          project: "${{ inputs.project }}"
          version: "${{ steps.version.outputs.version }}"
        run: |
          gh release create "${project}-${version}" \
            "${project}/${project}" \
            --title "Release ${project}-${version}"
