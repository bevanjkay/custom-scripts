name: Release Bash Project

permissions: {}

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project folder name (e.g., lctap)"
        required: true
        type: string
      version:
        description: "New version number (e.g., 1.0.1)"
        required: true
        type: string

jobs:
  release:
    runs-on: macos-latest
    environment: github_actions
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create Release
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          project: "${{ inputs.project }}"
          version: "${{ inputs.version }}"
        run: |
          gh release create "${project}-${version}" \
            "${project}/${project}.sh" \
            --title "Release ${project}-${version}"
