name: Release Node Project

permissions: {}

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project folder name (e.g., bible, fluro-songs, ghpr)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    environment: github_actions
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Read version
        id: version
        env:
          project: "${{ inputs.project }}"
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          version=$(jq -r '.version' "$project/package.json")
          if gh release view "${project}-${version}" &> /dev/null; then
            echo "Error: ${project}-${version} is already released; bump the version in $project/package.json first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build package
        env:
          project: "${{ inputs.project }}"
        run: |
          npm ci
          npm run build --workspace "$project"
          npm pack --workspace "$project"

      - name: Create Release
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          project: "${{ inputs.project }}"
          version: "${{ steps.version.outputs.version }}"
        run: |
          gh release create "${project}-${version}" \
            "${project}-${version}.tgz" \
            --title "Release ${project}-${version}"
